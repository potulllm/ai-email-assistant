<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>AI Email Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --bg-main:#f5f7fa;--bg-panel:#eef1f5;--bg-card:#ffffff;--bg-input:#ffffff;
  --text-main:#1f2937;--text-muted:#6b7280;--border:#d1d5db;--accent:#2563eb;
  --btn-bg:#2563eb;--btn-text:#ffffff;
}
body.dark{
  --bg-main:#0f172a;--bg-panel:#020617;--bg-card:#020617;--bg-input:#020617;
  --text-main:#e5e7eb;--text-muted:#9ca3af;--border:#1f2937;--accent:#60a5fa;
  --btn-bg:#60a5fa;--btn-text:#020617;
}
body{
  margin:0;font-family:"Segoe UI",system-ui,sans-serif;
  background:var(--bg-main);color:var(--text-main)
}
.app{display:flex;height:100vh}

/* SIDEBAR */
.sidebar{
  width:320px;background:var(--bg-panel);padding:14px;
  border-right:1px solid var(--border);overflow-y:auto
}
.sidebar-header{
  display:flex;justify-content:space-between;align-items:center
}
.history-item{
  background:var(--bg-card);padding:10px;border-radius:8px;margin-bottom:10px;
  cursor:pointer;border-left:4px solid var(--accent)
}
.history-item.wysoki{border-color:#dc2626}
.history-item.normalny{border-color:#2563eb}
.history-item.niski{border-color:#16a34a}
.history-title{font-weight:600;font-size:14px}
.history-meta{font-size:12px;color:var(--text-muted)}

/* MAIN */
.main{flex:1;padding:30px;overflow-y:auto}
textarea,select{
  width:100%;padding:12px;margin-bottom:12px;font-size:15px;
  border-radius:6px;border:1px solid var(--border);
  background:var(--bg-input);color:var(--text-main)
}
button{
  padding:10px 16px;border-radius:6px;
  border:1px solid var(--border);
  background:var(--btn-bg);
  color:var(--btn-text);
  cursor:pointer;
  font-size:14px;
  font-weight:600;
}
button.copy-success{background:#16a34a;color:#fff}

/* RESULT */
.result-grid{
  display:grid;
  grid-template-columns: 1.3fr 0.7fr;
  gap:20px;
  margin-top:20px;
  max-width:1200px;
}
.card{
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
}
.mail-subject{font-size:17px;font-weight:600;margin-bottom:14px}
.mail-body{font-size:16px;line-height:1.7;white-space:pre-wrap}

/* INFO */
.info-row{margin-bottom:12px}
.info-label{font-size:12px;color:var(--text-muted)}
.info-value{font-size:14px;font-weight:500}

.priority-badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
  text-transform:uppercase;
}
.priority-wysoki{background:#dc2626;color:#fff}
.priority-normalny{background:#2563eb;color:#fff}
.priority-niski{background:#16a34a;color:#fff}


</style>
</head>

<body>

<div class="app">

<!-- SIDEBAR -->
<div class="sidebar">
  <div class="sidebar-header">
    <h3>Historia</h3>
    <div style="display:flex; gap:6px">
      <button onclick="clearHistory()" title="Wyczyść historię">🗑️</button>
      <button onclick="toggleTheme()" title="Tryb jasny / ciemny">🌗</button>
    </div>
  </div>

  <div id="history"></div>
</div>

<!-- MAIN -->
<div class="main">
  <h2>AI Email Assistant</h2>

  <textarea id="emailInput" rows="6" placeholder="Wklej maila od klienta..."></textarea>

  <select id="responseType">
    <option value="default">Standardowa</option>
    <option value="contact">Kontakt wkrótce</option>
    <option value="clarify">Prośba o doprecyzowanie</option>
    <option value="pricing">Informacja o wycenie</option>
    <option value="decline">Odmowa</option>
  </select>

  <select id="responseStyle">
    <option value="professional">Profesjonalny</option>
    <option value="friendly">Przyjazny</option>
    <option value="concise">Krótki</option>
    <option value="partner">Partnerski</option>
    <option value="corporate">Korporacyjny</option>
  </select>

  <textarea id="pricingText" rows="3" placeholder="Ceny / widełki"
    style="display:none"></textarea>

  <button onclick="analyze()">Analizuj</button>
  <button id="copyBtn" onclick="copyMail()">Kopiuj odpowiedź</button>

  <div id="result"></div>
</div>

</div>

<script>
/* THEME */
if(localStorage.getItem("theme")==="dark")document.body.classList.add("dark");
function toggleTheme(){
  const d=document.body.classList.toggle("dark");
  localStorage.setItem("theme",d?"dark":"light");
}

document.getElementById("quickReply").onchange = () => {
  const quickReply = document.getElementById("quickReply");
  const emailInput = document.getElementById("emailInput");

  if (quickReply.value === "contact") {
    emailInput.value += "\n\nProszę o chwilę cierpliwości — wrócimy z informacją.";
  }
  if (quickReply.value === "clarify") {
    emailInput.value += "\n\nCzy mogą Państwo doprecyzować szczegóły zapytania?";
  }
  if (quickReply.value === "pricing") {
    emailInput.value += "\n\nPrzygotujemy orientacyjną wycenę po otrzymaniu szczegółów.";
  }

  quickReply.value = "";
};

responseType.onchange=()=>pricingText.style.display=
  responseType.value==="pricing"?"block":"none";

/* HELPERS */
function extract(label,text){
  const regex = new RegExp(label + "\\s*:?\\s*([\\s\\S]*?)(?:\\n\\n|\\n[A-Z🧠📂⚠️🏷️✉️📝]|$)");
  const match = text.match(regex);
  return match ? match[1].trim() : "—";
  
}

/* HISTORY */
const history=JSON.parse(localStorage.getItem("history")||"[]");
const historyDiv=document.getElementById("history");
const resultDiv=document.getElementById("result");

function renderHistory(){
  historyDiv.innerHTML="";
  const order = { wysoki:1, normalny:2, niski:3 };

  [...history]
   .sort((a,b)=>(order[a.priority]||9)-(order[b.priority]||9))
   .forEach(item=>{
    const div=document.createElement("div");
    div.className="history-item "+item.priority;
    div.innerHTML=`
      <div class="history-title">${item.title}</div>
      <div class="history-meta">${item.time}</div>
    `;
    div.onclick = () => {
      emailInput.value = item.originalEmail || "";
      renderResult(item.text);
};
    historyDiv.appendChild(div);
  });
}

/* ANALYZE */
async function analyze(){
  const email=emailInput.value;
  if(!email){resultDiv.innerHTML="<div class='card'>Brak treści maila.</div>";return;}
  const key=new URLSearchParams(window.location.search).get("key");
  if(!key){
  resultDiv.innerHTML = `
    <div class="card" style="max-width:600px">
      <h3>🔒 Dostęp płatny</h3>
      <p>
        Aby korzystać z aplikacji, wymagany jest zakup dostępu.
      </p>
      <p>
        Po zakupie otrzymasz klucz, który odblokuje analizę maili.
      </p>
      <a
        href="https://potulllm.gumroad.com/l/AIEmailAssistant"
        target="_blank"
        style="
          display:inline-block;
          margin-top:10px;
          padding:10px 16px;
          background:var(--accent);
          color:#fff;
          border-radius:6px;
          text-decoration:none;
          font-weight:600;
        "
      >
        👉 Kup dostęp do aplikacji
      </a>
    </div>
  `;
  return;
}

  resultDiv.innerHTML = `
  <div class="result-grid">
    <div class="card">
      <div class="mail-subject">Analiza w toku…</div>
      <div class="mail-body">AI analizuje treść maila i przygotowuje odpowiedź.</div>
    </div>
    <div class="card">
      <div class="info-row"><div class="info-label">Status</div><div class="info-value">⏳ Analiza…</div></div>
      <div class="info-row"><div class="info-label">Priorytet</div><div class="info-value">—</div></div>
      <div class="info-row"><div class="info-label">Kategoria</div><div class="info-value">—</div></div>
      <div class="info-row"><div class="info-label">Tagi</div><div class="info-value">—</div></div>
      <div class="info-row"><div class="info-label">Sugestia</div><div class="info-value">—</div></div>
    </div>
  </div>
`;

  const res=await fetch("/analyze?key="+key,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      email,
      responseType:responseType.value,
      responseStyle:responseStyle.value,
      pricingText:pricingText.value
    })
  });
  const data=await res.json();
  renderResult(data.result);

  history.unshift({
    text:data.result,
    originalEmail: email,
    title:extract("🧠 TYTUŁ SPRAWY",data.result),
    priority:extract("⚠️ PRIORYTET",data.result),
    time:new Date().toLocaleString("pl-PL")
  });
  localStorage.setItem("history",JSON.stringify(history));
  renderHistory();
}

function extractBlock(label, text) {
  const start = text.indexOf(label);
  if (start === -1) return "—";

  const afterLabel = text.slice(start + label.length);
  const nextSection = afterLabel.search(/\n[A-Z🧠📂⚠️🏷️✉️📝]/);

  if (nextSection === -1) {
    return afterLabel.replace(/^:\s*/, "").trim();
  }

  return afterLabel
    .slice(0, nextSection)
    .replace(/^:\s*/, "")
    .trim();
}

/* RENDER RESULT */
function renderResult(text){
  resultDiv.innerHTML=`
  <div class="result-grid">

    <div class="card">
      <div class="mail-subject">${extract("🧠 TYTUŁ SPRAWY",text)}</div>
      <div class="mail-body">
      ${extractBlock("✉️ GOTOWA ODPOWIEDŹ DO KLIENTA", text)}
      </div>
    </div>

    <div class="card">
      <div class="info-row"><div class="info-label">Data analizy</div><div class="info-value">${new Date().toLocaleString("pl-PL")}</div></div>
      <div class="info-row"><div class="info-label">Priorytet</div><div class="info-value">${extract("⚠️ PRIORYTET",text)}</div></div>
      <div class="info-row"><div class="info-label">Kategoria</div><div class="info-value">${extract("📂 KATEGORIA",text)}</div></div>
      <div class="info-row"><div class="info-label">Tagi</div><div class="info-value">${extract("🏷️ TAGI",text)}</div></div>
      <div class="info-row"><div class="info-label">Co klient chce / Sugestia</div><div class="info-value">${extract("📝 UWAGI",text)}</div></div>
    </div>

  </div>`;
}


/* COPY */
function copyMail(){
  const body=document.querySelector(".mail-body");
  if(!body)return;
  navigator.clipboard.writeText(body.innerText);
  const btn=document.getElementById("copyBtn");
  btn.textContent="✔ Skopiowano";
  btn.classList.add("copy-success");
  setTimeout(()=>{
    btn.textContent="Kopiuj odpowiedź";
    btn.classList.remove("copy-success");
  },2000);
}

renderHistory();

function clearHistory(){
  if(!confirm("Czy na pewno wyczyścić historię?")) return;
  localStorage.removeItem("history");
  history.length = 0;
  renderHistory();
  resultDiv.innerHTML = "";
}


</script>

</body>
</html>
