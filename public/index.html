<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AI Email Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      margin: 0;
      display: flex;
      height: 100vh;
    }
    .sidebar {
      width: 300px;
      background: #eceff3;
      padding: 12px;
      overflow-y: auto;
      border-right: 1px solid #ccc;
    }
    .item {
      background: #fff;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      border-left: 4px solid #2563eb;
    }
    .item.wysoki { border-color: #dc2626; }
    .item.normalny { border-color: #2563eb; }
    .item.niski { border-color: #16a34a; }

    .main {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    textarea, select {
      width: 100%;
      margin-bottom: 8px;
      padding: 8px;
    }
    button {
      padding: 8px 14px;
      margin-right: 6px;
    }
    pre {
      background: #fff;
      padding: 12px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="sidebar">
  <h3>Historia</h3>
  <button onclick="clearHistory()">Wyczyść</button>
  <div id="history"></div>
</div>

<div class="main">
  <h2>AI Email Assistant</h2>

  <textarea id="emailInput" rows="6" placeholder="Wklej maila klienta"></textarea>

  <select id="responseType">
    <option value="default">Standardowa</option>
    <option value="clarify">Doprecyzowanie</option>
    <option value="pricing">Wycena</option>
    <option value="decline">Odmowa</option>
  </select>

  <select id="responseStyle">
    <option value="professional">Profesjonalny</option>
    <option value="friendly">Przyjazny</option>
    <option value="concise">Krótki</option>
    <option value="partner">Partnerski</option>
    <option value="corporate">Korporacyjny</option>
  </select>

  <textarea id="pricingText" rows="3" placeholder="Ceny / widełki (opcjonalnie)"></textarea>

  <button onclick="analyze()">Analizuj</button>
  <button onclick="copyResult()">Kopiuj odpowiedź</button>

  <pre id="result"></pre>
</div>

<script>
  const resultBox = document.getElementById("result");
  const historyDiv = document.getElementById("history");
  const history = JSON.parse(localStorage.getItem("history") || "[]");

  function extract(label, text) {
    const m = text.match(new RegExp(label + ":[\\s\\S]*?\\n([^\\n]*)"));
    return m ? m[1].trim() : "";
  }

  function renderHistory() {
    historyDiv.innerHTML = "";
    history.forEach(item => {
      const div = document.createElement("div");
      div.className = "item " + item.priority;
      div.innerText = item.title;
      div.onclick = () => resultBox.innerText = item.text;
      historyDiv.appendChild(div);
    });
  }

  function clearHistory() {
    localStorage.removeItem("history");
    history.length = 0;
    renderHistory();
  }

  async function analyze() {
    const email = document.getElementById("emailInput").value;
    if (!email) {
      resultBox.innerText = "Brak treści maila.";
      return;
    }

    const key = new URLSearchParams(window.location.search).get("key");
    if (!key) {
      resultBox.innerHTML =
        "Dostęp płatny.<br><a href='https://potulllm.gumroad.com/l/AIEmailAssistant'>Kup dostęp</a>";
      return;
    }

    resultBox.innerText = "Analiza...";

    const res = await fetch("/analyze?key=" + key, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email,
        responseType: responseType.value,
        responseStyle: responseStyle.value,
        pricingText: pricingText.value
      })
    });

    const data = await res.json();
    resultBox.innerText = data.result;

    history.unshift({
      text: data.result,
      title: extract("🧠 TYTUŁ SPRAWY", data.result) || "Mail",
      priority: extract("⚠️ PRIORYTET", data.result) || "normalny"
    });

    localStorage.setItem("history", JSON.stringify(history));
    renderHistory();
  }

  function copyResult() {
    navigator.clipboard.writeText(resultBox.innerText);
  }

  renderHistory();
</script>

</body>
</html>
