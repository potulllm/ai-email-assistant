<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AI Email Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7f9;
      color: #1f2937;
      margin: 0;
      padding: 30px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 10px;
      font-size: 15px;
    }

    button {
      margin-top: 10px;
      padding: 8px 14px;
      font-size: 14px;
    }

    #result {
      margin-top: 20px;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #ccc;
      white-space: pre-wrap;
    }

    a {
      color: #2563eb;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <h2>AI Email Assistant</h2>

  <textarea id="emailInput" placeholder="Wklej treść maila klienta"></textarea>
  <br>

  <button type="button" onclick="analyze()">Analizuj</button>


  <div id="result"></div>

  <script>
    console.log("JS DZIALA");

    function analyze() {
     var textarea = document.getElementById("emailInput");
     var email = textarea.value;

     console.log("EMAIL VALUE:", email);

     if (!email || email.length === 0) {
      document.getElementById("result").innerText = "Brak tresci maila.";
      return;
     }

      var params = new URLSearchParams(window.location.search);
      var accessKey = params.get("key");

      if (!accessKey) {
        document.getElementById("result").innerHTML =
          "<strong>Dostep platny</strong><br><br>" +
          "Aby korzystac z aplikacji, wymagany jest zakup dostepu.<br><br>" +
          "<a href='https://potulllm.gumroad.com/l/AIEmailAssistant' target='_blank'>" +
          "Kup dostep</a>";
        return;
      }

      document.getElementById("result").innerText = "Analiza...";

      fetch("/analyze?key=" + accessKey, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email: email })
      })
      .then(function(response) {
        if (!response.ok) {
          throw new Error("Blad serwera");
        }
        return response.json();
      })
      .then(function(data) {
        document.getElementById("result").innerText =
          data.result || "Brak odpowiedzi AI.";
      })
      .catch(function() {
        document.getElementById("result").innerText =
          "Blad polaczenia z serwerem.";
      });
    }
  </script>

</body>
</html>
