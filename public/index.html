<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AI Email Assistant</title>

  <style>
    :root {
      --bg-main: #f6f7f9;
      --bg-panel: #f4f4f4;
      --bg-card: #fbfbfc;
      --bg-box: #f1f3f5;
      --text-main: #1f2937;
      --text-muted: #6b7280;
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-panel: #020617;
      --bg-card: #020617;
      --bg-box: #020617;
      --text-main: #e5e7eb;
      --text-muted: #9ca3af;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      transition: background .2s, color .2s;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 320px;
      background: var(--bg-panel);
      padding: 15px;
      overflow-y: auto;
      border-right: 1px solid rgba(0,0,0,.1);
    }

    .history-item {
      background: var(--bg-card);
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .priority-wysoki { border-left: 5px solid #d97706; }
    .priority-normalny { border-left: 5px solid #2563eb; }
    .priority-niski { border-left: 5px solid #059669; }

    .main {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    textarea {
      width: 100%;
      padding: 10px;
      font-size: 15px;
      background: var(--bg-box);
      color: var(--text-main);
    }

    select, button {
      margin-top: 6px;
      padding: 6px;
      font-size: 14px;
    }

    #resultBox {
      margin-top: 16px;
      padding: 14px;
      background: var(--bg-box);
      border-radius: 6px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="sidebar">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h3>Historia</h3>
    <button onclick="toggleTheme()">🌙 / ☀️</button>
  </div>

  <button onclick="clearHistory()" style="margin-bottom:10px;">
    🗑️ Wyczyść historię
  </button>

  <div id="history"></div>
</div>


  <div class="main">
    <h2>AI Email Assistant</h2>

    <textarea id="emailInput" placeholder="Wklej maila tutaj..." rows="7"></textarea>

    <br><br>

    <label>Typ odpowiedzi</label><br>
    <select id="responseType">
      <option value="default">Standardowa</option>
      <option value="contact">Kontakt</option>
      <option value="clarify">Doprecyzowanie</option>
      <option value="pricing">Orientacyjna wycena</option>
      <option value="decline">Odmowa</option>
    </select>

    <br><br>

    <label>Styl odpowiedzi</label><br>
    <select id="responseStyle">
      <option value="professional">Profesjonalny</option>
      <option value="friendly">Przyjazny</option>
      <option value="concise">Krótki</option>
      <option value="partner">Partnerski</option>
      <option value="corporate">Korporacyjny</option>
    </select>

    <div id="pricingBox" style="display:none;">
      <textarea id="pricingText" rows="3" placeholder="Widełki cenowe"></textarea>
    </div>

    <br>

    <button onclick="analyze()">Analizuj</button>
    <button onclick="copyResult()">Kopiuj odpowiedź</button>

    <div id="resultBox"></div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);


const history = JSON.parse(localStorage.getItem("history") || "[]");
const historyDiv = document.getElementById("history");
const resultBox = document.getElementById("resultBox");

function toggleTheme() {
  document.body.classList.toggle("dark");
}

document.getElementById("responseType").onchange = e => {
  pricingBox.style.display = e.target.value === "pricing" ? "block" : "none";
};

async function analyze() {
  const email = emailInput.value.trim();
  if (!email) return;


  const accessKey = new URLSearchParams(window.location.search).get("key");

  if (!accessKey) {
    resultBox.innerHTML = `
      🔒 Dostęp płatny<br><br>
      <a href="https://potulllm.gumroad.com/l/AIEmailAssistant" target="_blank">
        👉 Kup dostęp
      </a>`;
    return;
  }

  resultBox.innerText = "Analiza...";

  const response = await fetch(`/analyze?key=${accessKey}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      email,
      responseType: responseType.value,
      responseStyle: responseStyle.value,
      pricing: pricingText.value
    })
  });

  if (!response.ok) {
    resultBox.innerText = "Błąd dostępu.";
    return;
  }

  const data = await response.json();
  resultBox.innerText = data.result;

  history.unshift({
    text: data.result,
    priority: "normalny",
    title: "Mail klienta",
    timestamp: Date.now()
  });

  localStorage.setItem("history", JSON.stringify(history));
  renderHistory();
}

 function clearHistory() {
  if (!confirm("Czy na pewno wyczyścić historię?")) return;
  localStorage.removeItem("history");
  history.length = 0;
  renderHistory();
}


function renderHistory() {
  historyDiv.innerHTML = "";
  history.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.innerText = item.title;
    div.onclick = () => resultBox.innerText = item.text;
    historyDiv.appendChild(div);
  });
}

function copyResult() {
  navigator.clipboard.writeText(resultBox.innerText);
}

renderHistory();
console.log("JS DZIAŁA");
</script>

</body>
</html>
